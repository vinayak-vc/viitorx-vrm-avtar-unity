name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: package.json is valid and matches CHANGELOG
        shell: bash
        run: |
          python - <<'PY'
          import json, re, sys

          pkg = json.load(open("package.json", encoding="utf-8"))

          required = ["name", "version", "displayName", "description", "unity"]
          missing = [k for k in required if not pkg.get(k)]
          if missing:
              sys.exit("package.json is missing required field(s): %s" % ", ".join(missing))

          # Unity requires a lowercase reverse-DNS name.
          if not re.fullmatch(r"[a-z0-9]+(\.[a-z0-9][a-z0-9-]*)+", pkg["name"]):
              sys.exit("package name is not a valid UPM identifier: %s" % pkg["name"])

          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?", pkg["version"]):
              sys.exit("version is not semver: %s" % pkg["version"])

          # The changelog must actually document the version being shipped, so a release cannot go
          # out with an unreleased-but-tagged version.
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          if "## [%s]" % pkg["version"] not in changelog:
              sys.exit("CHANGELOG.md has no '## [%s]' section" % pkg["version"])

          print("package.json OK - %s %s" % (pkg["name"], pkg["version"]))
          PY

      - name: LICENSE and notices are present
        shell: bash
        run: |
          for f in LICENSE README.md CHANGELOG.md ThirdPartyNotices.txt; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "distribution files present"

  sidecar:
    name: Sidecar self-tests
    # Windows and 3.10 are not preferences: depthai publishes cp310 wheels only, and
    # onnxruntime-directml is a Windows package.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned dependencies
        working-directory: python-sidecar~
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt

      - name: Imports resolve
        working-directory: python-sidecar~
        run: python -c "import depthai, cv2, numpy, onnxruntime; print('imports OK')"

      - name: DirectML provider is available
        working-directory: python-sidecar~
        # Guards the failure mode that cost this project days: onnxruntime silently falls back to
        # CPU when the GPU provider cannot load, turning ~31 ms/frame into ~183 ms with no error.
        run: |
          python -c "import onnxruntime as ort, sys; p = ort.get_available_providers(); print(p); sys.exit(0 if 'DmlExecutionProvider' in p else 'DmlExecutionProvider missing - wrong onnxruntime package installed')"

      - name: Byte-compile every script
        working-directory: python-sidecar~
        run: python -m compileall -q . -x "(\.venv|\.git|__pycache__|depthai_blazepose|evidence)"

      - name: Self-tests
        working-directory: python-sidecar~
        # No pytest: each prints "N/N assertions passed" and exits non-zero on failure.
        run: |
          python tests/test_target_ownership.py
          python tests/test_kinematic_recovery.py
          python tests/test_joint_tracker.py
          python tests/test_pose_validation.py
          python tests/test_surface_depth.py

      - name: Analysis self-tests
        working-directory: python-sidecar~
        run: |
          python tools/diagnostics/f26_fidelity_analyze.py --selftest
          python tools/diagnostics/f27_humanized_analyze.py --selftest

      - name: No absolute machine paths crept back in
        working-directory: python-sidecar~
        shell: bash
        # Seven files once hardcoded C:\Unity\... to a checkout that exists on no machine. Every
        # path must resolve through evidence_paths instead.
        run: |
          if grep -rIn --include=*.py -E 'r?"[A-Za-z]:[\\/]' . \
               --exclude-dir=.venv --exclude-dir=evidence --exclude-dir=depthai_blazepose; then
            echo "absolute path found - use evidence_paths instead"
            exit 1
          fi
          echo "no absolute paths"
